services:
  switchbook:
    build: .
    container_name: switchbook-prod
    restart: always
    ports:
      - "3050:3050"
    environment:
      - NODE_ENV=production
      - PORT=3050
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3050/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
