services:
  switchbook:
    build: .
    container_name: switchbook-prod
    restart: always
    ports:
      - "3050:3050"
    # Для прямого доступа к физическим VLAN сервера, LLDP и беспрепятственного сканирования ARP
    # на выделенных Linux-хостах можно раскомментировать network_mode и закомментировать ports:
    # network_mode: "host"
    environment:
      - NODE_ENV=production
      - PORT=3050
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3050/api/health | grep -q 'ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
