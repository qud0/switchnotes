# nginx/switchbook.conf
# Production Nginx Reverse Proxy with SSL & WebSocket support for SwitchBook

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream switchbook_backend {
    server 127.0.0.1:3050;
    keepalive 32;
}

server {
    listen 80;
    server_name switchbook.local switch.corp.local;

    # Редирект на HTTPS для боевого использования:
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Web-SSH терминал и WebSocket шлюз
    location /ws/ssh {
        proxy_pass http://switchbook_backend/ws/ssh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API и основной интерфейс
    location / {
        proxy_pass http://switchbook_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Кэширование статических ассетов
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            proxy_pass http://switchbook_backend;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
